name: analysis-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest-and-sql-explain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pytest (including falsifiable / anti-example assertions)
        run: pytest -q

      - name: SQL EXPLAIN dry-run against fixtures/schema.sqlite
        run: python scripts/sql_explain.py
