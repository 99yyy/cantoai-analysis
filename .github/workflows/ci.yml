name: analysis-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # "edited" re-runs the checks when the pull-request body changes, so the
    # Gate-review line that history-audit asks for is seen once it is added.
    # On a pull request every job runs on every event type: a job skipped by
    # `if:` reports success and would replace an earlier failure of that check.
    types: [opened, synchronize, reopened, edited]

# Least privilege: the gates only read the repository. With no write scope,
# nothing that runs here can push, comment, or post a passing status.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run; every push to
# main keeps its own group (keyed by commit), so no main commit goes unchecked.
concurrency:
  group: analysis-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to full commit hashes: a tag can be moved.
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Take the gate config from the base branch, not from this PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          rm -rf /tmp/gate && mkdir -p /tmp/gate
          git archive "origin/$BASE_REF" scripts | tar -x -C /tmp/gate --strip-components=1
      - name: The gate tests first, from a tree that holds no worker file
        # Worker branches may write tests/** and src/**. A module there, or a
        # native extension that shadows a gate test's name, can change what the
        # gate tests check once it shares their process, and any code of theirs
        # that runs can rewrite files on disk. So the gate tests run before
        # anything else, from a copy of the tree whose tests/ holds only the
        # listed gate tests with their fixtures and mutation probes, and which
        # has no src/. The list is the union of the base's and this change's
        # (gate_config.json, gate_tests), so a change cannot drop a test. No
        # conftest, no cache, importlib mode.
        env:
          GATE_DIR: ${{ github.event_name == 'pull_request' && '/tmp/gate' || 'scripts' }}
        run: |
          python -I - > /tmp/gate_tests.txt <<'EOF'
          import json, os, subprocess
          names = set()
          for d in sorted({os.environ["GATE_DIR"], "scripts"}):
              path = os.path.join(d, "gate_config.json")
              if os.path.isfile(path):
                  with open(path, encoding="utf-8") as f:
                      names.update(json.load(f).get("gate_tests", {}).get("files", []))
          tracked = set(subprocess.run(
              ["git", "ls-files", "tests"], capture_output=True, text=True, check=True
          ).stdout.split())
          for name in sorted(names):
              if name in tracked and name.count("/") == 1 and name.endswith(".py"):
                  print(name)
          EOF
          if [ ! -s /tmp/gate_tests.txt ]; then
            echo "::error::gate_config.json lists no gate test that exists in this tree"
            exit 1
          fi
          mapfile -t gate_tests < /tmp/gate_tests.txt
          echo "gate tests: ${gate_tests[*]}"
          tree="$RUNNER_TEMP/gate-tests-tree"
          rm -rf "$tree" && mkdir -p "$tree"
          cp -a . "$tree/"
          rm -rf "$tree/tests" "$tree/src"
          mkdir "$tree/tests"
          cp "${gate_tests[@]}" "$tree/tests/"
          for d in fixtures mutations; do
            if [ -d "tests/$d" ]; then cp -a "tests/$d" "$tree/tests/"; fi
          done
          cd "$tree"
          python -I -m pytest -q -c pyproject.toml --noconftest -p no:cacheprovider \
            --import-mode=importlib "${gate_tests[@]}"
      - name: Every test; green while the repository has no test yet
        run: |
          if find tests -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            pytest -q
          else
            echo "no tests/test_*.py yet; this job starts checking the moment one appears"
          fi

  output-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Take the gates from the base branch, not from this PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          rm -rf /tmp/gate && mkdir -p /tmp/gate
          # The whole scripts/ directory as the base branch has it: every gate,
          # the config they read (gate_config.json) and the tables they load.
          # The gate scripts a pull request is judged by are the base's, not its
          # own. `python -I` keeps /tmp/gate off sys.path, so no file there can
          # stand in for a standard-library module.
          git archive "origin/$BASE_REF" scripts | tar -x -C /tmp/gate --strip-components=1
      - name: Replay every number, and make the two computations agree
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python -I /tmp/gate/output_check.py \
            --base-ref "origin/$BASE_REF" \
            --head-ref HEAD
      - name: The same on main, where there is no branch point to check
        if: github.event_name != 'pull_request'
        run: python -I scripts/output_check.py --head-ref HEAD
      - name: Double, permute and exclude invariants, from the base branch's gates
        # relations.py imports output_check.py from its own directory, so both
        # come from /tmp/gate. Temp corpora go to $RUNNER_TEMP, never data/.
        if: github.event_name == 'pull_request'
        run: python -I /tmp/gate/relations.py --head-ref HEAD
      - name: The same on main
        if: github.event_name != 'pull_request'
        run: python -I scripts/relations.py --head-ref HEAD
      - name: A pull request that changes the gates also passes its own gates
        # Can only add failures: the base's gates above still decide. The
        # pull-request run judges the tasks this change touches. The main-mode
        # run judges every task, closed ones included, the way main will after
        # the merge; it fails only where the base's gates, run the same way on
        # the same tree, pass. So a gate change that would turn main red shows
        # here, before the merge.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE_REF...HEAD" -- scripts; then
            echo "scripts/ unchanged; the base's gates above are this pull request's gates"
            exit 0
          fi
          python -I scripts/output_check.py --base-ref "origin/$BASE_REF" --head-ref HEAD
          own=0
          python -I scripts/output_check.py --head-ref HEAD || own=1
          python -I scripts/relations.py --head-ref HEAD || own=1
          if [ "$own" = 0 ]; then
            echo "the new gates pass every task in main mode"
            exit 0
          fi
          base=0
          python -I /tmp/gate/output_check.py --head-ref HEAD > /tmp/base_main_mode.log 2>&1 || base=1
          python -I /tmp/gate/relations.py --head-ref HEAD >> /tmp/base_main_mode.log 2>&1 || base=1
          if [ "$base" = 0 ]; then
            echo "::error::the new gates fail in main mode where the base's gates pass; merging this would turn main red"
            exit 1
          fi
          echo "the base's gates fail in main mode on this tree as well (log below); the pull-request runs above decide"
          cat /tmp/base_main_mode.log

  scope-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Take the gates from the base branch, not from this PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          rm -rf /tmp/gate && mkdir -p /tmp/gate
          # The whole scripts/ directory as the base branch has it: every gate,
          # the config they read (gate_config.json) and the tables they load.
          # The gate scripts a pull request is judged by are the base's, not its
          # own. `python -I` keeps /tmp/gate off sys.path, so no file there can
          # stand in for a standard-library module.
          git archive "origin/$BASE_REF" scripts | tar -x -C /tmp/gate --strip-components=1
      - name: Every branch must belong to a known class
        # Everything GitHub-controlled goes through env, never into the script
        # text: a branch name is attacker-chosen and `${{ }}` inside run: is a
        # shell injection. The PR author is who authorizes repair/ and chore/;
        # the actor changes to cursor[bot] on every agent push and is only the
        # fallback for runs without a pull request. SCOPE_AUTHOR is read from
        # the environment, not passed as a flag: the gate copy comes from the
        # base branch, and an older copy must still accept this command line.
        env:
          SCOPE_BRANCH: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          SCOPE_ACTOR: ${{ github.actor }}
          SCOPE_AUTHOR: ${{ github.event.pull_request.user.login }}
          SCOPE_OWNERS: ${{ github.repository_owner }}
        run: |
          python -I /tmp/gate/scope_check.py \
            --branch "$SCOPE_BRANCH" \
            --base "origin/$BASE_REF" \
            --actor "$SCOPE_ACTOR" \
            --owners "$SCOPE_OWNERS"

  history-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Take the gates from the base branch, not from this PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          rm -rf /tmp/gate && mkdir -p /tmp/gate
          # The whole scripts/ directory as the base branch has it: every gate,
          # the config they read (gate_config.json) and the tables they load.
          # The gate scripts a pull request is judged by are the base's, not its
          # own. `python -I` keeps /tmp/gate off sys.path, so no file there can
          # stand in for a standard-library module.
          git archive "origin/$BASE_REF" scripts | tar -x -C /tmp/gate --strip-components=1
      - name: Capture the pull-request body without interpolating it into a shell
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr_body.txt
      - name: A bar may not move in the change that moves what it measures
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python -I /tmp/gate/history_audit.py \
            --base "origin/$BASE_REF" \
            --pr-body-file /tmp/pr_body.txt
